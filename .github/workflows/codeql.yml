name: CodeQL

# GitHub's code scanning: looks for security problems in the C# code and in the workflows on every push to main, every
# pull request and once a week, and lists them under Security → Code scanning. On GitHub's free plan code scanning needs
# a public repository, so the job skips itself while the repository is private.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write # uploads the findings to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app targets Windows; restoring its packages for the analysis works best there.
          - language: csharp
            os: windows-latest
          - language: actions
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL reads C# without building it (build-mode none), but restores its packages with the SDK global.json pins.
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
