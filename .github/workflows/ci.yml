name: CI

# Builds the app and runs the tests on every push to main and every pull request, as the release workflow does
# before it packs (docs/release.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # libmpv comes from this repository's own mirror release (native.lock.json), which docs/release.md uploads once:
      # until it exists this step fails. The cache keeps the verified archive once a download worked; its key follows
      # native.lock.json, so a new pin (url and sha256) starts a new cache.
      - name: Cache libmpv
        uses: actions/cache@v4
        with:
          path: native/cache
          key: libmpv-${{ hashFiles('native.lock.json') }}

      - name: Fetch libmpv
        shell: pwsh
        run: ./scripts/fetch-native.ps1

      - name: Build the app
        run: dotnet build src/Granary.App/Granary.App.csproj -c Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/Granary.Tests -c Release -p:Platform=x64
