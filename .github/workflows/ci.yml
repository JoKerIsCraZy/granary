name: CI

# Builds the app and runs the tests on every push to main and every pull request, as the release workflow does
# before it packs (docs/release.md). The native-deps workflow starts it by hand on its update branch, since a pull
# request its token opens starts no pull_request workflows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # libmpv comes from this repository's own mirror release (native.lock.json). The cache keeps the verified archive
      # once a download worked; its key follows native.lock.json, so a new pin (url and sha256) starts a new cache.
      - name: Cache libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/cache
          key: libmpv-${{ hashFiles('native.lock.json') }}

      - name: Fetch libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }} # reads the mirror release's asset while the repository is private
        run: ./scripts/fetch-native.ps1

      - name: Build the app
        run: dotnet build src/Granary.App/Granary.App.csproj -c Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/Granary.Tests -c Release -p:Platform=x64
