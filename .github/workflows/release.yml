name: Release

# Builds Granary's setup, portable zip and update package with Velopack, signs them and publishes them as a GitHub release
# (docs/release.md). Run it by hand on main with a version; it tags the commit it built as it publishes. The build job can
# only read the repository and sees no secret. The publish job alone may write and gets the update signing key, and it
# waits for a reviewer's approval in the "release" environment, which takes runs from main only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.2.0
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A run from another branch would bring that branch's copy of this file; the "release" environment refuses it anyway.
      - name: Check the run is on main
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:REF -cne 'refs/heads/main') {
            throw "Run the release workflow on main, not on $env:REF."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Taken from an environment variable, never pasted into the script, so the input cannot inject commands. As the app
      # takes a version: [0-9] (\d takes any script's digits) and \z (a $ allows a line end after it).
      - name: Read the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ($version -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\z') {
            throw "Not a version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Fetch libmpv
        shell: pwsh
        run: ./scripts/fetch-native.ps1

      - name: Test
        run: dotnet test tests/Granary.Tests -c Release -p:Platform=x64

      # vpk comes as scripts/get-vpk.ps1 pins it by SHA-256. Fails while src/Granary.Core/Updates/update-key.pub is the
      # placeholder: such a build could never apply an update.
      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/pack-release.ps1 -Version $env:VERSION -Repository "https://github.com/$env:GITHUB_REPOSITORY" -RequireNotes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: artifacts/releases
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: windows-latest
    # Waits for a required reviewer, and only then gets UPDATE_SIGNING_KEY (docs/release.md, "Signed releases").
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # A version goes out once: a tag that exists already would carry this release to whatever commit it names.
      - name: Check the version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v$env:VERSION" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the repository's tags."
          }
          if (@($tags) -ccontains "refs/tags/v$env:VERSION") {
            throw "The tag v$env:VERSION exists already. Release a new version."
          }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the repository's releases."
          }
          if (@($releases) -ccontains "v$env:VERSION") {
            throw "A release or draft for v$env:VERSION exists already. Release a new version."
          }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts/releases

      # Before anything is uploaded. The script stops unless the key is the pair of the public key the app carries, so
      # no release goes out that installed copies would refuse.
      - name: Sign
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/sign-release.ps1 -Version $env:VERSION

      # A draft first, published only once SHA256SUMS and its signature are on it: no client ever sees the release
      # without them. Publishing tags the commit this run built. vpk reads its token from VPK_TOKEN, so the token is on
      # no command line.
      - name: Publish the release
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $vpk = ./scripts/get-vpk.ps1
          dotnet $vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --outputDir artifacts/releases `
            --releaseName "Granary $env:VERSION" --tag "v$env:VERSION" --targetCommitish $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "vpk upload failed with exit code $LASTEXITCODE"
          }
          gh release upload "v$env:VERSION" artifacts/signed/SHA256SUMS artifacts/signed/SHA256SUMS.sig --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Adding SHA256SUMS failed with exit code $LASTEXITCODE; the release stays a draft."
          }
          gh release edit "v$env:VERSION" --draft=false --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing failed with exit code $LASTEXITCODE; the release stays a draft."
          }
