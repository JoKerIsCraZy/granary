<svg class="gb" xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="200" height="200" role="img" aria-label="Granary lädt">
  <style>
    .gb .seg { stroke-dasharray: 28 72; animation: gb-run calc(1.4s * var(--rate, 1)) linear infinite; }
    .gb .play { transform-box: fill-box; transform-origin: 40% 50%;
      animation: gb-pulse calc(1.4s * var(--rate, 1)) ease-in-out infinite; }
    @keyframes gb-run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
    @keyframes gb-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .7; transform: scale(.88); }
    }
    @media (prefers-reduced-motion: reduce) {
      :root:not(.motion-on) .gb * { animation: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="gb-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <path d="M180 84 A68 68 0 1 0 192 151" fill="none" stroke="#8A8A96" stroke-opacity=".22" stroke-width="30" stroke-linecap="round"/>
  <path class="seg" pathLength="100" d="M180 84 A68 68 0 1 0 192 151" fill="none" stroke="url(#gb-ring)" stroke-width="30" stroke-linecap="round"/>
  <path class="play" d="M114 106 L154 128 L114 150 Z" fill="#E8E8EC" stroke="#E8E8EC" stroke-width="10" stroke-linejoin="round"/>
</svg>
