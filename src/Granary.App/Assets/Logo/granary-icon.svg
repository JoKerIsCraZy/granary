<?xml version="1.0" encoding="UTF-8"?>
<!-- Granary's app icon: its mark on a dark rounded tile. Granary's own; not Silo's. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Granary">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="#2A2A30" stroke="#3A3A42" stroke-width="4"/>
  <g transform="translate(128 128) scale(0.86) translate(-128 -128)">
    <path d="M180 84 A68 68 0 1 0 192 151" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
    <path d="M114 106 L154 128 L114 150 Z" fill="#E8E8EC" stroke="#E8E8EC" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
