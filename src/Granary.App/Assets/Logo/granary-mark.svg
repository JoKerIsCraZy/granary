<?xml version="1.0" encoding="UTF-8"?>
<!-- Granary's mark: a "G" as a ring from red to gold around a play triangle. Granary's own; not Silo's. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 176 176" width="176" height="176" role="img" aria-label="Granary">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <path d="M180 84 A68 68 0 1 0 192 151" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round"/>
  <path d="M114 106 L154 128 L114 150 Z" fill="#E8E8EC" stroke="#E8E8EC" stroke-width="10" stroke-linejoin="round"/>
</svg>
