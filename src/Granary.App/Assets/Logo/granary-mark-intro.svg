<svg class="ga" xmlns="http://www.w3.org/2000/svg" viewBox="28 28 200 200" width="200" height="200" role="img" aria-label="Granary">
  <style>
    .ga .ring { stroke-dasharray: 100 100; stroke-dashoffset: 100; opacity: 0; transform-box: view-box; transform-origin: 128px 128px;
      animation: ga-draw calc(.95s * var(--rate, 1)) cubic-bezier(.55, 0, .2, 1) forwards; }
    .ga .play { transform-box: fill-box; transform-origin: 40% 50%; opacity: 0;
      animation: ga-pop calc(.5s * var(--rate, 1)) cubic-bezier(.3, 1.45, .5, 1) calc(.62s * var(--rate, 1)) forwards; }
    .ga .glint { stroke-dasharray: 7 93; stroke-dashoffset: 7; opacity: 0;
      animation: ga-glint calc(.7s * var(--rate, 1)) ease-in-out calc(1.02s * var(--rate, 1)) forwards; }
    @keyframes ga-draw {
      0% { stroke-dashoffset: 100; opacity: 0; transform: rotate(-40deg); }
      6% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; transform: rotate(0deg); }
    }
    @keyframes ga-pop {
      0% { opacity: 0; transform: translateX(-12px) scale(.2); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes ga-glint {
      0% { stroke-dashoffset: 7; opacity: 0; }
      15%, 85% { opacity: .55; }
      100% { stroke-dashoffset: -93; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      :root:not(.motion-on) .ga * { animation: none !important; }
      :root:not(.motion-on) .ga .ring, :root:not(.motion-on) .ga .play { opacity: 1; stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <linearGradient id="ga-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <path class="ring" pathLength="100" d="M180 84 A68 68 0 1 0 192 151" fill="none" stroke="url(#ga-ring)" stroke-width="30" stroke-linecap="round"/>
  <path class="glint" pathLength="100" d="M180 84 A68 68 0 1 0 192 151" fill="none" stroke="#FFF6E0" stroke-width="12" stroke-linecap="round"/>
  <path class="play" d="M114 106 L154 128 L114 150 Z" fill="#E8E8EC" stroke="#E8E8EC" stroke-width="10" stroke-linejoin="round"/>
</svg>
